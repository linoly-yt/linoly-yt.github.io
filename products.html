<html>
	<head>
		<link rel="icon" href="favicon.ico">
		<style>
			body {
				background:lightblue;
				color:white;
				text-align:center;
				font-family:inherit;
			}
			
			button {
				border:none;
				background:white;
				border-radius:980px;
				padding:15px 25px;
				font-size:15px;
				font-weight:500;
    			cursor: pointer;
    			transition: background-color 0.2s ease, transform 0.1s ease;
				color:gray;
			}
			
			.info-btn {
				font-family: inherit;
    			font-size: 10px;
    			font-weight: 500;
    			padding: 15px 20px;
    			border: none;
    			border-radius: 980px;
    			background-color: #0071e3;
    			color: white;
    			cursor: pointer;
    			transition: background-color 0.2s ease, transform 0.1s ease;
			}
			
			.angebote-btn {
				font-family: inherit;
    			font-size: 15px;
    			font-weight: 500;
    			padding: 12px 24px;
    			border: none;
    			border-radius: 980px;
    			background-color:darkred;
    			color: white;
    			cursor: pointer;
    			transition: background-color 0.2s ease, transform 0.1s ease;
			}
			
			.info-div {
				position:fixed;
				bottom:25px;
				right:10px;
			}
			
			.angebote-div {
				position:fixed;
				bottom:25px;
				left:10px;
			}
			
  			dialog {
    			border: none;
    			border-radius: 24px;
    			padding: 32px;
    			max-width: 380px;
    			width: 90%;
    			background:white;
    			backdrop-filter: blur(20px);
    			-webkit-backdrop-filter: blur(20px);
    			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    			text-align: center;

  			@keyframes popIn {
    			from {
      				opacity: 0;
      				transform: scale(0.9) translateY(10px);
    			}
    			to {
      				opacity: 1;
      				transform: scale(1) translateY(0);
    				}
  			}

  			@keyframes popOut {
    			from {
      				opacity: 1;
      				transform: scale(1) translateY(0);
    				}
    				to {
      					opacity: 0;
      					transform: scale(0.9) translateY(10px);
    				}
  			}
		</style>
	</head>
		<body>
			<h1>Willkommen</h1>
			<button onclick="classes.showModal()">Tis is a botn</button>
			<dialog id="classes">
				<h2>Select:</h2>
				<button>1</button>
			</dialog>
		</body>
</html>
