<html>
	<head>
		<link rel="icon" href="favicon.ico">
		<style>
			body {
				font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
				background:lightblue;
				color:gray;
				text-align:center;
				user-select:none;
			}
			a {
				color:blue;
			}
			button {
				font-family: inherit;
    			font-size: 10px;
    			font-weight: 500;
    			padding: 15px 20px;
    			border: none;
    			border-radius: 980px;
    			background-color: lightgray;
    			color: gray;
    			cursor: pointer;
    			transition: background-color 0.2s ease, transform 0.1s ease;
			}
			.close-btn {
				font-family: inherit;
    			font-size: 10px;
    			font-weight: 500;
    			padding: 15px 20px;
    			border: none;
    			border-radius: 980px;
    			background-color: darkred;
    			color: red;
    			cursor: pointer;
    			transition: background-color 0.2s ease, transform 0.1s ease;
			}
			.info-btn {
				font-family: inherit;
    			font-size: 10px;
    			font-weight: 500;
    			padding: 15px 20px;
    			border: none;
    			border-radius: 980px;
    			background-color: #0071e3;
    			color: white;
    			cursor: pointer;
    			transition: background-color 0.2s ease, transform 0.1s ease;
			}
			.sales-btn {
				font-family: inherit;
    			font-size: 15px;
    			font-weight: 500;
    			padding: 12px 24px;
    			border: none;
    			border-radius: 980px;
    			background-color:darkred;
    			color: white;
    			cursor: pointer;
    			transition: background-color 0.2s ease, transform 0.1s ease;
			}
			.continue-btn {
				background:green;
			}
			.info-div {
				position:fixed;
				bottom:25px;
				right:10px;
			}
			.sales-div {
				position:fixed;
				bottom:25px;
				left:10px;
			}
  		dialog {
    		border: none;
    		border-radius: 24px;
    		padding: 32px;
    		max-width: 380px;
    		width: 90%;
    		background:white;
    		backdrop-filter: blur(20px);
    		-webkit-backdrop-filter: blur(20px);
    		box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    		text-align: center;
			}
  		@keyframes popIn {
    		from {
      			opacity: 0;
      			transform: scale(0.9) translateY(10px);
    		}
    		to {
      			opacity: 1;
      			transform: scale(1) translateY(0);
    			}
  		}
  		@keyframes popOut {
    		from {
      			opacity: 1;
      			transform: scale(1) translateY(0);
    			}
    			to {
      				opacity: 0;
      				transform: scale(0.9) translateY(10px);
    			}
  		}
		</style>
	</head>
		<body>
			<h1>Bricks 'n Kicks</h1>
			<h2>LEGO pieces</h2>
			
			<div class="sales-div">
				<button class="sales-btn" onclick="sales.showModal()">Sales</button>
			</div>
			
			<div class="info-div">
				<button class="info-btn" onclick="info.showModal()">i</button>
			</div>
			
			<dialog id="info">
				<h2>Information</h2>
				<p>Name: index.html</p>
				<p>Date of 'birth': 7. September 2026, 09:07</p>
				<p>Last update: 12.09.26, 23:03</p>
				<p>Version: 1.0.9</p>
				<p>File-size: 3 KB</p>
				<button onclick="info.close()" class="close-btn">Close</button>
			</dialog>
			
			<dialog id="sales">
				<h2>Sales</h2>
				<button onclick="window.location.href='products.html'" class="continue-btn">Continue</button>
				<br>
				<br>
				<button onclick="sales.close()" class="close-btn">Close</button>
			</dialog>
		</body>
</html>
